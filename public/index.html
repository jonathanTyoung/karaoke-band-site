<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Live band karaoke in Nashville, TN. Sing your favorite songs with professional musicians backing you up. Perfect for private events, parties, corporate gatherings, and unforgettable nights out. Book your rockstar moment today!"
    />

    <!-- Keywords for SEO -->
    <meta
      name="keywords"
      content="Nashville karaoke, live band karaoke, Nashville events, live music Nashville, karaoke band, private events Nashville, corporate events Nashville, party entertainment"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nashvillelivebandkaraoke.com" />
    <meta
      property="og:title"
      content="Nashville Live Band Karaoke | Sing with Professional Musicians"
    />
    <meta
      property="og:description"
      content="Experience live band karaoke in Nashville! Professional musicians back you up as you perform your favorite songs. Book now for events, parties, or an unforgettable night out."
    />
    <meta
      property="og:image"
      content="https://nashvillelivebandkaraoke.com/preview-image.jpg"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://nashvillelivebandkaraoke.com" />
    <meta
      name="twitter:title"
      content="Nashville Live Band Karaoke | Sing with Professional Musicians"
    />
    <meta
      name="twitter:description"
      content="Experience live band karaoke in Nashville! Professional musicians back you up as you perform your favorite songs. Book now for events, parties, or an unforgettable night out."
    />
    <meta
      name="twitter:image"
      content="https://nashvillelivebandkaraoke.com/preview-image.jpg"
    />

    <!-- Geo tags for local SEO -->
    <meta name="geo.region" content="US-TN" />
    <meta name="geo.placename" content="Nashville" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <title>
      Nashville Live Band Karaoke | Sing with Professional Musicians
    </title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Netlify Identity redirect handler -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
