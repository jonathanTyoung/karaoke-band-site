backend:
  name: git-gateway
  branch: main

media_folder: "public/images/gallery"
public_folder: "/images/gallery"

collections:
  - name: "gallery"
    label: "Gallery"
    files:
      - label: "Gallery Images"
        name: "images"
        file: "src/data/gallery.json"
        fields:
          - label: "Images"
            name: "images"
            widget: "list"
            fields:
              - { label: "Image", name: "url", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
              - {
                  label: "Caption",
                  name: "caption",
                  widget: "string",
                  required: false,
                }

  - name: "testimonials"
    label: "Testimonials"
    files:
      - label: "Testimonials List"
        name: "testimonials"
        file: "src/data/testimonials.json"
        fields:
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            fields:
              - { label: "Name", name: "author", widget: "string" }
              - { label: "Company / Role", name: "company", widget: "string" }
              - { label: "Quote", name: "text", widget: "text" }

  - name: "about"
    label: "About"
    files:
      - label: "About Section"
        name: "about"
        file: "src/data/about.json"
        fields:
          - { label: "About Text", name: "about_text", widget: "text" }
          - label: "Features"
            name: "features"
            widget: "list"
            fields:
              - { label: "Icon", name: "icon", widget: "string", hint: "Emoji" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
          - {
              label: "Reel Video",
              name: "reel_video",
              widget: "file",
              required: false,
              media_folder: "/public/videos",
              public_folder: "/videos",
              hint: "Vertical 9:16 MP4, muted. Shown beside the About text.",
            }
          - {
              label: "Reel Poster Image",
              name: "reel_poster",
              widget: "image",
              required: false,
              media_folder: "/public/videos",
              public_folder: "/videos",
              hint: "Still image shown before the reel loads (9:16).",
            }

  - name: "services"
    label: "Services"
    files:
      - label: "Services Section"
        name: "services"
        file: "src/data/services.json"
        fields:
          - label: "Service Cards"
            name: "services"
            widget: "list"
            fields:
              - { label: "Icon", name: "icon", widget: "string", hint: "Emoji" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
              - {
                  label: "Card Photo",
                  name: "image",
                  widget: "image",
                  required: false,
                  media_folder: "/public/images/services",
                  public_folder: "/images/services",
                }
